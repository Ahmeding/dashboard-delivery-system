<div class="bg-gradient-primary">

<div class="container">

  <div class="card o-hidden border-0 shadow-lg my-5">
    <div class="card-body p-0">
      <!-- Nested Row within Card Body -->
      <div class="row">
        <div class="col-lg-5 d-none d-lg-block bg-register-image"></div>
        <div class="col-lg-7">
          <div class="p-5">
            <div class="text-center">
              <h1 class="h4 text-gray-900 mb-4">Create an Account!</h1>
            </div>
            <div class="alert alert-danger" *ngIf="errorsMsg.length">
              <p *ngFor="let msg of errorsMsg">{{msg}}</p>
            </div>
            <form class="user">
              <div class="form-group row">
                <div class="col-sm-6 mb-3 mb-sm-0">
                  <input name="firstName" [(ngModel)]="registerRequest.firstName" type="text" class="form-control form-control-user" id="firstName"
                         placeholder="First Name">
                </div>
                <div class="col-sm-6">
                  <input name="lastName" [(ngModel)]="registerRequest.lastName" type="text" class="form-control form-control-user" id="lastName"
                         placeholder="Last Name">
                </div>
              </div>
              <div class="form-group">
                <input name="email" [(ngModel)]="registerRequest.email" type="email" class="form-control form-control-user" id="email"
                       placeholder="Email Address">
              </div>
              <div class="form-group row">
                <div class="col-sm-6 mb-3 mb-sm-0">
                  <input name="password" [(ngModel)]="registerRequest.password" type="password" class="form-control form-control-user"
                         id="password" placeholder="Password">
                </div>
                <div class="col-sm-6">
                  <input [(ngModel)]="registerRequest.password" type="password" class="form-control form-control-user"
                         name="repeatPassword"  id="repeatPassword" placeholder="Repeat Password">
                </div>
              </div>
              <a (click)="register()" class="btn btn-primary btn-user btn-block">
                Register Account
              </a>
            </form>
            <hr>
            <div class="text-center">
              <a class="small" href="#">Forgot Password?</a>
            </div>
            <div class="text-center">
              <a class="small" (click)="login()">Already have an account? Login!</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>


</div>
