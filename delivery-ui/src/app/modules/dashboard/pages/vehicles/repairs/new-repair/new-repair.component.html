<main>
  <div class="container-fluid px-4">
    <h1 class="mt-4">Ajouter Reparation</h1>
    <ol class="breadcrumb mb-4">
      <li class="breadcrumb-item"><a  [routerLink]="['/overview']">Dashboard</a></li>
      <li class="breadcrumb-item "><a [routerLink]="['/reparations']">Reparations</a></li>
      <li class="breadcrumb-item active">Nouveau Reparation</li>
    </ol>
    <div class="container">
      <div class="row justify-content-lg-start">
        <div class="col-lg-11">
          <div class="card shadow-lg border-0 rounded-lg mt-5">
            <div class="card-header"><h6 class="text-center font-weight-light my-4">Ajouter une nouvelle vehicule</h6></div>
            <div class="card-body">
              <div class="alert alert-success" ></div>
              <div class="alert alert-danger" >
              </div>

              <form>
                <!-- ligne 1-->
                <div class="row mb-3">
                  <div class="col-md-4">
                    <div class="form-floating mb-3 mb-md-0">
                      <input name="lastname" class="form-control" id="inputLastName" type="text" placeholder="Nom du Reparation" />
                      <label for="inputFirstName">Nom</label>
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="form-floating">
                      <input name="firstname" class="form-control" id="inputFirstName" type="text" placeholder="Enter your last name" />
                      <label for="inputFirstName">Prenom</label>
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="form-floating mb-3 mb-md-0">
                      <input name="datenaissance" class="form-control" id="inputdateNaissance" type="text" placeholder="Date de naissance" />
                      <label for="inputdateNaissance">Date de naissance</label>
                    </div>
                  </div>
                </div>

                <!-- ligne 2-->
                <div class="row mb-3">
                  <div class="col-md-6">
                    <div class="form-floating mb-3 mb-md-0">
                      <input name="numtel" class="form-control" id="inputnumTel" type="text" placeholder="Numero du telphone" />
                      <label for="inputnumTel">Numero du telephone</label>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-floating mb-3">
                      <input name="email" class="form-control" id="inputEmail" type="email" placeholder="name@example.com" />
                      <label for="inputEmail">Email address</label>
                    </div>
                  </div>
                </div>

                <!-- ligne 3-->
                <div class="row mb-3">
                  <div class="col-md-6">
                    <div class="form-floating mb-3 mb-md-0">
                      <input name="adresse1" class="form-control" id="inputAdresse1" type="text" placeholder="Adresse 1" />
                      <label for="inputAdresse1">Adresse 1</label>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-floating mb-3 mb-md-0">
                      <input name="adresse2" class="form-control" id="inputAdresse2" type="text" placeholder="Adresse 2" />
                      <label for="inputAdresse2">Adresse 2</label>
                    </div>
                  </div>
                </div>

                <!-- ligne 4-->
                <div class="row mb-3">
                  <div class="col-md-4">
                    <div class="form-floating mb-3 mb-md-0">
                      <input name="codepostale" class="form-control" id="inputCodePostale" type="text" placeholder="Code Postale" />
                      <label for="inputCodePostale">Code Postale</label>
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="form-floating mb-3 mb-md-0">
                      <input name="Ville" class="form-control" id="inputVille" type="text" placeholder="Ville" />
                      <label for="inputCodePostale">Code Postale</label>
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="form-floating mb-3 mb-md-0">
                      <input name="pays" class="form-control" id="inputPays" type="text" placeholder="Pays" />
                      <label for="inputPays">Pays</label>
                    </div>
                  </div>
                </div>
                <!-- ligne 6-->

                <div class="row mb-3">
                  <div class="col-md-6">
                    <div class="form-floating mb-3 mb-md-0">
                      <input name="password"   class="form-control" id="inputPassword" type="password" placeholder="Create a password" />
                      <label for="inputPassword">Password</label>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-floating mb-3 mb-md-0">
                      <input name="typepermis"  class="form-control" id="inputTypePermis" type="" placeholder="Type du Permis" />
                      <label for="inputTypePermis">Type du permis</label>
                    </div>
                  </div>
                </div>

                <div class="row mb-3">
                  <div class="col-md-6">
                    <div class="form-floating mb-3 mb-md-0">
                      <input name="numsecu"  class="form-control" id="inputNumSecu" type="text" placeholder="Num. secu." />
                      <label for="inputNumSecu">Num. Secu.</label>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-floating mb-3 mb-md-0">
                      <input name="rib"  class="form-control" id="inputRib" type="text" placeholder="Rib" />
                      <label for="inputRib">Rib</label>
                    </div>
                  </div>

                </div>

                <!-- ligne 7-->
                <div class="mt-4 mb-0">
                  <div class="d-grid">
                    <a class="btn btn-primary btn-block" >Enregistrer</a></div>
                </div>
              </form>
            </div>
            <div class="card-footer text-center py-3">
              <div class="small"><a [routerLink]="['/reparations']">Annuler</a></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
