<form (ngSubmit)="onSubmit()">
  <!-- Vehicle Selection Section -->
  <div class="row mb-3">
    <div class="col-md-4">
      <label for="vehicleSelect" class="form-label">Select Vehicle</label>
      <select id="vehicleSelect" [(ngModel)]="selectedVehicle" name="vehicle" class="form-select">
        <option [ngValue]="undefined">Choose a vehicle</option>
        <option *ngFor="let vehicle of availableVehicles" [ngValue]="vehicle">
          {{ vehicle.name }}
        </option>
      </select>
    </div>

    <!-- Driver Selection Section -->
    <div class="col-md-6">
      <label class="form-label">Select Drivers (max 2)</label>
      <select [(ngModel)]="selectedDrivers" name="drivers" class="form-select" multiple>
        <option *ngFor="let driver of availableDrivers" [ngValue]="driver">
          {{ driver.name }}
        </option>
      </select>
    </div>

    <div class="col-md-2 d-flex align-items-center">
      <button type="button" class="btn btn-primary" (click)="addVehicle()">Add Vehicle</button>
    </div>
  </div>

  <!-- Display Selected Vehicles and Drivers -->
  <div class="mt-3">
    <h5>Selected Vehicles and Drivers</h5>
    <div *ngFor="let item of selectedVehicles; let i = index" class="row mb-2">
      <div class="col-md-4">
        <strong>Vehicle:</strong> {{ item.vehicle.name }}
      </div>
      <div class="col-md-6">
        <strong>Drivers:</strong>
        <ul>
          <li *ngFor="let driver of item.drivers">{{ driver.name }}</li>
        </ul>
      </div>
      <div class="col-md-2">
        <button type="button" class="btn btn-danger" (click)="removeVehicle(i)">Remove</button>
      </div>
    </div>
  </div>

  <button type="submit" class="btn btn-success mt-3">Submit Mission</button>
</form>
