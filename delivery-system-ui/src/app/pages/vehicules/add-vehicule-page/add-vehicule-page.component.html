<main>
  <div class="container-fluid px-4">
    <h1 class="mt-4">Ajouter Vehicule</h1>
    <ol class="breadcrumb mb-4">
      <li class="breadcrumb-item"><a  [routerLink]="['/overview']">Dashboard</a></li>
      <li class="breadcrumb-item "><a [routerLink]="['/vehicules']">Vehicules</a></li>
      <li class="breadcrumb-item active">Nouveau Vehicule</li>
    </ol>

    <div class="alert alert-danger" *ngIf="errorMsgs.length>0">
      <ul *ngFor="let msg of errorMsgs"><li>{{msg}}</li></ul>
    </div>
    <div class="card mb-4">
      <div class="card-body">


        <form>
          <!-- ligne 1-->
          <div class="row mb-3">
            <div class="col-md-4">
              <div class="form-floating mb-3 mb-md-0">
                <input [(ngModel)]="vehiculeDto.marque" name="marque"  class="form-control" id="inputMarque" type="text" placeholder="Marque du Vehicule" />
                <label for="inputMarque">Marque</label>
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-floating">
                <input [(ngModel)]="vehiculeDto.modele" name="modele" class="form-control" id="inputModel" type="text" placeholder="Modele vehicule" />
                <label for="inputModel">Modele</label>
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-floating mb-3 mb-md-0">
                <input [(ngModel)]="vehiculeDto.immatriculation" name="immat" class="form-control" id="inputImmat" type="text" placeholder="Imatriculation" />
                <label for="inputImmat">Imatriculation</label>
              </div>
            </div>
          </div>

          <!-- ligne 2-->
          <div class="row mb-3">
            <div class="col-md-6">
              <div class="form-floating mb-3 mb-md-0">
                <input [(ngModel)]="vehiculeDto.numVin" name="numvin" class="form-control" id="inputNumVin" type="text" placeholder="Numero VIN" />
                <label for="inputNumVin">Numero VIN</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating mb-3">
                <input [(ngModel)]="vehiculeDto.datePMC" name="datepmc" class="form-control" id="inputDatePMC" type="text" placeholder="Date P.M.C." />
                <label for="inputDatePMC">Date P.M.C.</label>
              </div>
            </div>
          </div>

          <!-- ligne 3-->
          <div class="row mb-3">

            <div class="col-md-4">
              <div class="form-floating mb-3 mb-md-0">
                <input [(ngModel)]="vehiculeDto.typecarburant" name="typecarburant" class="form-control" id="inputTypeCarburant" type="text" placeholder="Type du carburant" />
                <label for="inputTypeCarburant">Type Carburant</label>
                <select name="typecarburant" (ngModelChange)="selcttc($event)" [(ngModel)]="typeCarburant" >
                  <option>Selectionné type du craburant</option>
                  <option *ngFor="let tc of typeCarburant" [value]="tc" >{{tc}}</option>
                </select>
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-floating mb-3 mb-md-0">
                <input [(ngModel)]="vehiculeDto.kilometrage" name="Kilometrage" class="form-control" id="inputKilometrage" type="text" placeholder="Kilometrage" />
                <label for="inputKilometrage">Kilometrage</label>
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-floating mb-3 mb-md-0">
                <input [(ngModel)]="vehiculeDto.volume" name="volume" class="form-control" id="inputVolume" type="text" placeholder="Volume" />
                <label for="inputVolume">Volume</label>
              </div>
            </div>
          </div>

          <!-- ligne 4-->
          <div class="row mb-3">
            <div class="col-md-4">
              <div class="form-floating mb-3 mb-md-0">
                <input [(ngModel)]="vehiculeDto.dateExpCtrlTec" name="dateExpirCT" class="form-control" id="inputdateExpirCT" type="text" placeholder="Date Expir.CT." />
                <label for="inputdateExpirCT">Date Expir. CT</label>
              </div>
            </div>
          </div>
          <!-- ligne 6-->

          <!-- ligne 7-->
          <div class="mt-4 mb-0">
            <div class="d-grid">
              <a class="btn btn-primary btn-block" (click)="saveVehicule()" >Enregistrer</a></div>
          </div>
        </form>

      </div>
    </div>
  </div>
</main>
