<div id="content">
  <!-- Begin Page Content -->
  <div class="container-fluid">

    <!-- Page Heading -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
      <h1 class="h3 mb-0 text-gray-800">Vehicles</h1>
    </div>
    <div class="container mt-5">
  <div class="card shadow-hover p-4">
    <h3 class="text-center mb-4">Create New Vehicle</h3>
    <div class="vehicle-form">
      <form [formGroup]="vehicleForm" (ngSubmit)="onSubmit()">
        <div class="row g-4">
          <!-- Brand, Model, License Plate -->
          <div class="col-md-3">
            <div class="form-floating">
              <select id="type" (change)="onTypeChange()" formControlName="vehicleType"
                      [class.is-invalid]="vehicleForm.get('vehicleType')?.invalid && vehicleForm.get('vehicleType')?.touched"
                      class="form-select">
                <option value="" disabled selected>Select a Type</option>
                <option *ngFor="let t of types" [value]="t">
                  {{ t }}</option>
              </select>
              <label for="type">Type</label>
              <div class="invalid-feedback">Type is required</div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="form-floating">
              <!-- <input
                 formControlName="marque"
                 class="form-control"
                 [class.is-invalid]="vehicleForm.get('marque')?.invalid && vehicleForm.get('marque')?.touched"
                 id="marque"
                 type="text"
                 placeholder="Brand"
                 (input)="filterMarques(vehicleForm.get('marque')?.value)"
                 (blur)="onSelectMarque(vehicleForm.get('marque')?.value)"
               >-->
              <select id="marque" formControlName="marque" (change)="onMarqueChange()"
                      [class.is-invalid]="vehicleForm.get('marque')?.invalid && vehicleForm.get('marque')?.touched"
                      class="form-select">
                <option value="" disabled selected>Select a brand</option>
                <option *ngFor="let m of marques" [value]="m.marque">
                 {{m.marque}}
                </option>
              </select>
              <label for="marque">Brand</label>
              <div class="invalid-feedback">Brand is required</div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="form-floating">
              <select id="modele" class="form-select" formControlName="modele"
                      [class.is-invalid]="vehicleForm.get('modele')?.invalid && vehicleForm.get('modele')?.touched"
                      [disabled]="!models.length">
                <option value="" disabled selected>select model</option>
                <option *ngFor="let m of models" [value]="m">
                  {{ m }}</option>
              </select>

              <label for="modele">Model</label>
              <div class="invalid-feedback">Model is required</div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="form-floating">
              <input
                formControlName="immatriculation"
                class="form-control license-plate-input"
                [class.is-invalid]="vehicleForm.get('immatriculation')?.invalid
                && vehicleForm.get('immatriculation')?.touched"
                id="immatriculation"
                type="text"
                placeholder="License Plate"
                (click)="onGeneratelicensePlateClick()"
              >
              <label for="immatriculation">License Plate</label>
              <small class="invalid-feedback">Invalid format. Please use 'AB-123-CD'.</small>
            </div>
          </div>
          <!-- VIN, First Registration Date -->
          <div class="col-md-6">
            <div class="form-floating">
              <input
                formControlName="numVin"
                class="form-control"
                [class.is-invalid]="vehicleForm.get('numVin')?.invalid && vehicleForm.get('numVin')?.touched"
                id="numVin"
                type="text"
                placeholder="VIN Number"
                (click)="onGenerateVinClick()"
              >
              <label for="numVin">VIN Number</label>
              <small class="invalid-feedback">Invalid N° VIN format.</small>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-floating">
              <input
                formControlName="datePMC"
                class="form-control"
                [class.is-invalid]="vehicleForm.get('datePMC')?.invalid && vehicleForm.get('datePMC')?.touched"
                id="datePMC"
                type="date"
              >
              <label for="datePMC">First Registration Date</label>
              <small class="invalid-feedback">Registration date is required</small>
            </div>
          </div>
          <!-- Mileage, Volume -->
          <div class="col-md-6">
            <div class="form-floating">
              <input
                formControlName="kilometrage"
                class="form-control"
                [class.is-invalid]="vehicleForm.get('kilometrage')?.invalid && vehicleForm.get('kilometrage')?.touched"
                id="kilometrage"
                type="number"
                min="0"
                placeholder="Mileage"
              >
              <label for="kilometrage">Mileage (km)</label>
              <small class="invalid-feedback">Valid mileage is required</small>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-floating">
              <input
                formControlName="volume"
                class="form-control"
                [class.is-invalid]="vehicleForm.get('volume')?.invalid && vehicleForm.get('volume')?.touched"
                id="volume"
                type="number"
                min="0"
                step="0.1"
                placeholder="Volume"
              >
              <label for="volume">Volume (m³)</label>
              <small class="invalid-feedback">Valid volume is required</small>
            </div>
          </div>
          <!-- Fuel Type, Technical Control Date -->
          <div class="col-md-6">
            <div class="form-floating">
              <select
                formControlName="typecarburant"
                class="form-select"
                [class.is-invalid]="vehicleForm.get('typecarburant')?.invalid && vehicleForm.get('typecarburant')?.touched"
                id="typecarburant"
              >
                <option value="">Select fuel type</option>
                <option *ngFor="let f of carburantOptions" [value]="f">
                  {{ f }}
                </option>
              </select>
              <label for="typecarburant">Fuel Type</label>
                  <small class="invalid-feedback">Fuel type is required</small>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-floating">
              <input
                formControlName="dateExpCtrlTec"
                class="form-control"
                id="dateExpCtrlTec"
                type="date"
                placeholder="Technical Control Expiry Date"
              >
              <label for="dateExpCtrlTec">Technical Control Expiry Date</label>
            </div>
          </div>
        </div>

        <div class="form-actions mt-4">
          <button type="button" class="btn btn-light" (click)="navigateToVehicleList()">
            Cancel
          </button>
          <button type="submit" class="btn btn-primary" [disabled]="vehicleForm.invalid">
            Save Vehicle
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
  </div></div>
