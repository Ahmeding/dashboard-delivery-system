<div class="service-delivery-container">
  <div class="header-section">
    <div class="title-section">
      <h1>Delivery Point Categories</h1>
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input type="text" placeholder="Search services..." [(ngModel)]="searchTerm" (keyup)="filterServices()">
      </div>
    </div>
    <button class="btn btn-primary" (click)="openNewCategoryModal()">
      <i class="bi bi-plus-lg"></i>
      New Delivery Point Category
    </button>
  </div>

  <div class="table-card">
    <div class="table-responsive">
      <table class="table">
        <thead>
        <tr>
          <th>
            <div class="th-content">
              <i class="bi bi-hash"></i>
              Ref
            </div>
          </th>
          <th>
            <div class="th-content">
              <i class="bi bi-card-text"></i>
              Name
            </div>
          </th>
          <th>
            <div class="th-content">
              <i class="bi bi-cash-stack"></i>
              Fees
            </div>
          </th>
          <th>
            <div class="th-content">
              <i class="bi bi-person"></i>
              Created By
            </div>
          </th>
          <th>
            <div class="th-content">
              <i class="bi bi-gear"></i>
              Actions
            </div>
          </th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let dpCategory of allDeliveryPointCategoryResponse.content">
          <td>
              <span class="reference">
                <i class="bi bi-upc text-primary"></i>
                {{ dpCategory.reference }}
              </span>
          </td>
          <td>
              <span class="title">
                <i class="bi bi-star-fill text-info"></i>
                {{ dpCategory.name }}
              </span>
          </td>
          <td>
              <span class="price">
                <i class="bi bi-tag text-primary"></i>
                +{{ dpCategory.additionalFees || "0" }}%
              </span>
          </td>
          <td>
            <div class="creator-info">
              <div class="creator-avatar">
                {{ dpCategory.createdByUser?.fullname?.[0] }}
              </div>
              <span>{{ dpCategory.createdByUser?.fullname }}</span>
            </div>
          </td>
          <td>
            <div class="action-buttons">
              <button class="btn btn-icon" (click)="editDelivPointCategory(dpCategory)">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-icon" (click)="selectedDelivPointCategory = dpCategory">
                <i class="bi bi-eye"></i>
              </button>
              <button class="btn btn-icon text-danger" (click)="deleteDelivPointCategory(dpCategory.id!)">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="pagination-container">
      <div class="items-per-page">
        <span>Show:</span>
        <select [(ngModel)]="size" (change)="onPageSizeChange()">
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50">50</option>
        </select>
      </div>

      <ul class="pagination">
        <li class="page-item" [class.disabled]="page === 0">
          <a class="page-link" (click)="goToFirstPage()">
            <i class="bi bi-chevron-double-left"></i>
          </a>
        </li>
        <li class="page-item" [class.disabled]="page === 0">
          <a class="page-link" (click)="goToPreviousPage()">
            <i class="bi bi-chevron-left"></i>
          </a>
        </li>
        <li class="page-item" *ngFor="let _ of [].constructor(allDeliveryPointCategoryResponse.totalPages); let pageIndex = index"
            [class.active]="page === pageIndex">
          <a class="page-link" (click)="goToPage(pageIndex)">{{pageIndex + 1}}</a>
        </li>
        <li class="page-item" [class.disabled]="isLastPage">
          <a class="page-link" (click)="goToNextPage()">
            <i class="bi bi-chevron-right"></i>
          </a>
        </li>
        <li class="page-item" [class.disabled]="isLastPage">
          <a class="page-link" (click)="goToLastPage()">
            <i class="bi bi-chevron-double-right"></i>
          </a>
        </li>
      </ul>
    </div>
  </div>
</div>
