<div class="container py-4">
  <div class="card shadow-hover">
    <div class="card-header text-center">
      <h3 class="mb-0 text-primary">Create New User</h3>
    </div>
    <div class="card-body">
      <form (ngSubmit)="onSubmit()" #userForm="ngForm">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <input
                type="text"
                id="firstname"
                name="firstname"
                class="form-control"
                required
                [(ngModel)]="user.firstname"
                placeholder=" "
              />
              <label for="firstname">First Name</label>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <input
                type="text"
                id="lastname"
                name="lastname"
                class="form-control"
                required
                [(ngModel)]="user.lastname"
                placeholder=" "
              />
              <label for="lastname">Last Name</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            required
            [(ngModel)]="user.email"
            placeholder=" "
          />
          <label for="email">Email</label>
        </div>

        <div class="form-group">
          <input
            type="tel"
            id="phoneNum"
            name="phoneNum"
            class="form-control"
            required
            [(ngModel)]="user.phoneNum"
            placeholder=" "
          />
          <label for="phoneNum">Phone Number</label>
        </div>

        <div class="form-group">
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            required
            [(ngModel)]="user.password"
            placeholder=" "
          />
          <label for="password">Password</label>
        </div>

        <div class="form-group">
          <select
            id="role"
            name="role"
            class="form-control"
            [(ngModel)]="user.role"
            required
          >
            <option value="" disabled selected>Select Role</option>
            <option value="ADMIN">Admin</option>
            <option value="USER">User</option>
          </select>
          <label for="role">Role</label>
        </div>

        <div class="text-center mt-4">
          <button type="submit" class="btn btn-primary" [disabled]="!userForm.valid">
            <i class="bi bi-person-plus"></i> Add User
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
