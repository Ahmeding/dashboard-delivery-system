<div class="service-delivery-form-container">
  <div class="form-header">
    <h2>{{ isEditing ? 'Edit' : 'New' }} Service Delivery</h2>
    <button type="button" class="btn btn-outline" (click)="reset()">
      <i class="bi bi-arrow-counterclockwise"></i>
      Reset
    </button>
  </div>

  <form [formGroup]="serviceDeliveryForm" (ngSubmit)="onSubmit()" class="form-content">
    <div class="form-grid">
      <!-- Destination Country -->
      <div class="form-field">
        <label for="destinationCountry">Destination Country</label>
        <div class="input-container location-container">
          <i class="bi bi-map"></i>
          <input
            id="destinationCountry"
            type="text"
            formControlName="destinationCountry"
            [class.is-invalid]="serviceDeliveryForm.get('destinationCountry')?.invalid && serviceDeliveryForm.get('destinationCountry')?.touched"
            placeholder="Enter Destination Country">
        </div>
        <div class="error-message" *ngIf="serviceDeliveryForm.get('destinationCountry')?.invalid && serviceDeliveryForm.get('destinationCountry')?.touched">
          Destination Country is required
        </div>
      </div>
      <!-- Title (Delivery Point) -->
      <div class="form-field">
        <label for="destinationCity">Destination City</label>
        <div class="input-container">
          <i class="bi bi-hash"></i>
          <input
            id="destinationCity"
            type="text"
            formControlName="destinationCity"
            [class.is-invalid]="serviceDeliveryForm.get('destinationCity')?.invalid && serviceDeliveryForm.get('destinationCity')?.touched"
          >
        </div>
        <div class="error-message" *ngIf="serviceDeliveryForm.get('destinationCity')?.invalid && serviceDeliveryForm.get('destinationCity')?.touched">
          Destination-City is required
        </div>
      </div>

      <!-- Title (Delivery Point Selection) -->
      <!--<div class="form-field">
        <label for="titled">Delivery Point</label>
        <div class="input-container">
          <i class="bi bi-geo-alt"></i>
          <select
            id="titled"
            formControlName="title"
            [class.is-invalid]="serviceDeliveryForm.get('title')?.invalid && serviceDeliveryForm.get('title')?.touched"
          >
            <option value="">Select a delivery point</option>
            <option *ngFor="let point of deliveryPoints" [value]="point.name">
              {{point.name}} ({{point.deliveryPointType}})
            </option>
          </select>
        </div>
        <div class="error-message" *ngIf="serviceDeliveryForm.get('title')?.invalid && serviceDeliveryForm.get('title')?.touched">
          Delivery point is required
        </div>
      </div>-->
      <!-- Pickup Location -->
      <div class="form-field">
        <label for="pickUpLocation">Pickup Location</label>
        <div class="input-container location-container">
          <i class="bi bi-truck"></i>
          <input
            id="pickUpLocation"
            type="text"
            formControlName="pickUpLocation"
            [class.is-invalid]="serviceDeliveryForm.get('pickUpLocation')?.invalid && serviceDeliveryForm.get('pickUpLocation')?.touched"
            placeholder="Enter pickup location"
          >
          <button type="button" class="location-btn">
            <i class="bi bi-geo-alt-fill"></i>
          </button>
        </div>
        <div class="error-message" *ngIf="serviceDeliveryForm.get('pickUpLocation')?.invalid && serviceDeliveryForm.get('pickUpLocation')?.touched">
          Pickup location is required
        </div>
      </div>

      <!-- Distance -->
      <div class="form-field">
        <label for="distance">Distance (km)</label>
        <div class="input-container distance-container">
          <i class="bi bi-signpost-split"></i>
          <input
            id="distance"
            type="number"
            step="0.1"
            formControlName="distance"
            [class.is-invalid]="serviceDeliveryForm.get('distance')?.invalid && serviceDeliveryForm.get('distance')?.touched"
            placeholder="Enter distance"
          >
          <span class="distance-unit">km</span>
        </div>
        <div class="error-message" *ngIf="serviceDeliveryForm.get('distance')?.invalid && serviceDeliveryForm.get('distance')?.touched">
          Valid distance is required
        </div>
      </div>

      <!-- Description -->
      <div class="form-field full-width">
        <label for="description">Description</label>
        <div class="input-container">
          <i class="bi bi-text-paragraph"></i>
          <textarea
            id="description"
            formControlName="description"
            rows="3"
            [class.is-invalid]="serviceDeliveryForm.get('description')?.invalid && serviceDeliveryForm.get('description')?.touched"
          ></textarea>
        </div>
        <div class="error-message" *ngIf="serviceDeliveryForm.get('description')?.invalid && serviceDeliveryForm.get('description')?.touched">
          Description is required
        </div>
      </div>
      <!-- Unit Price HT -->
      <div class="form-field">
        <label for="unitPriceHT">Basic Trip Cost (HT)</label>
        <div class="input-container">
          <i class="bi bi-currency-euro"></i>
          <input
            id="unitPriceHT"
            type="number"
            step="0.01"
            formControlName="unitPriceHT"
            [class.is-invalid]="serviceDeliveryForm.get('unitPriceHT')?.invalid && serviceDeliveryForm.get('unitPriceHT')?.touched"
          >
        </div>
        <div class="error-message" *ngIf="serviceDeliveryForm.get('unitPriceHT')?.invalid && serviceDeliveryForm.get('unitPriceHT')?.touched">
          Basic Trip Cost is required
        </div>
      </div>
      <!-- TVA -->
      <div class="form-field">
        <label for="tva">TVA (%)</label>
        <div class="input-container">
          <i class="bi bi-percent"></i>
          <input
            id="tva"
            type="number"
            step="0.1"
            formControlName="tva"
            [class.is-invalid]="serviceDeliveryForm.get('tva')?.invalid && serviceDeliveryForm.get('tva')?.touched"
          >
        </div>
        <div class="error-message" *ngIf="serviceDeliveryForm.get('tva')?.invalid && serviceDeliveryForm.get('tva')?.touched">
          TVA must be between 0 and 100
        </div>
      </div>
      <!-- Price TTC (Read-only) -->
      <div class="form-field">
        <label for="basicTripCost">Basic Trip Cost (TTC)</label>
        <div class="input-container">
          <i class="bi bi-currency-euro"></i>
          <input
            id="basicTripCost"
            type="number"
            formControlName="basicTripCost"
            readonly
            class="readonly"
          >
        </div>
      </div>
      <div class="form-field">
        <label for="color">Color</label>
        <div class="input-container">
          <i class="bi bi-palette"></i>
          <input
            id="color"
            type="color"
            formControlName="color"
            [class.is-invalid]="serviceDeliveryForm.get('color')?.invalid && serviceDeliveryForm.get('color')?.touched"
          >
        </div>
        <div class="error-message" *ngIf="serviceDeliveryForm.get('color')?.invalid && serviceDeliveryForm.get('color')?.touched">
          Color is required
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-outline" routerLink="/service-delivery">
        Cancel
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="!serviceDeliveryForm.valid">
        {{ isEditing ? 'Update' : 'Create' }} Service Delivery
      </button>
    </div>
  </form>
</div>
