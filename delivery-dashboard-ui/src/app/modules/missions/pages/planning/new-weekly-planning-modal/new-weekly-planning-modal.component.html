<div class="modal-content delivery-destination-modal">
  <div class="modal-header">
    <h5 class="modal-title">
      <i class="bi bi-geo-alt-fill"></i>
      New Weekly Planning
    </h5>
    <button type="button" class="btn-close" (click)="activeModal.dismiss()"></button>
  </div>

  <div class="modal-body">
    <!-- -->
    <form [formGroup]="wPlanningForm">
      <div class="form-group mb-4 position-relative">
        <select
          type="text"
          id="title"
          formControlName="title"
          class="form-control"
          [class.is-invalid]="wPlanningForm.get('title')?.invalid && wPlanningForm.get('name')?.touched"
        >
          <option [ngValue]="undefined" disabled selected>select a week</option>
          <option  [ngValue]="undefined" disabled selected>select a week</option>
        </select>
        <label for="title">
          <i class="bi bi-card-text text-primary me-1"></i> Category Name
        </label>
        <div *ngIf="wPlanningForm.get('title')?.invalid && wPlanningForm.get('title')?.touched"
             class="invalid-feedback">
          Week  is required.
        </div>
      </div>
      <div class="form-group mb-4 position-relative">
        <select
          type="text"
          id="service"
          formControlName="delveryDestination"
          class="form-control"
          [class.is-invalid]="wPlanningForm.get('destinationCity')?.invalid && wPlanningForm.get('destinationCity')?.touched"
        >
          <option [ngValue]="undefined" disabled selected>select a week</option>
          <option *ngFor="let dCity of allDestinations" [ngValue]="dCity.destinationCity">{{ dCity.destinationCity }}</option>
        </select>
        <label for="service">
          <i class="bi bi-card-text text-primary me-1"></i> Destination City
        </label>
        <div *ngIf="wPlanningForm.get('delveryDestination')?.invalid && wPlanningForm.get('delveryDestination')?.touched"
             class="invalid-feedback">
          Delivery Destination City is required.
        </div>
      </div>
      <div class="days-container">
        <div class="day-checkbox" *ngFor="let day of ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday']; let i = index">
          <input
            type="checkbox"
            [id]="day.toLowerCase()"
            [formControlName]="'day' + (i + 1)"
          class="custom-checkbox"
          />
          <label [for]="day.toLowerCase()" class="custom-label">
            <i class="bi bi-calendar-event me-2"></i> {{ day }}
          </label>
        </div>
      </div>
    </form>

  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">
      <i class="bi bi-x-lg"></i>
      Cancel
    </button>
    <button type="button" class="btn btn-primary" (click)="saveWeeklyPlanning()" [disabled]="!wPlanningForm.valid">
      <i class="bi bi-check-lg"></i>
      Save Destination
    </button>
  </div>
</div>
