<div class="mission-card" [style.borderLeft]="'4px solid ' + getDestinationColor()">
  <div class="mission-header">
    <div class="time-destination">
      <span class="time">{{ getStartTime() }}</span>
      <span class="destination-tag" [style.color]="getDestinationColor()">
        {{ mission.deliveryDestinationResponse?.serviceDelivery?.destinationCity }}
      </span>
    </div>
    <div class="status">
      <i [class]="'bi ' + getStatusIcon()" [title]="mission.etatMission"></i>
    </div>
  </div>

  <div class="mission-content">
    <p class="title">{{ mission.titre }}</p>
    <div class="resources">
      <div class="vehicles" *ngIf="mission.missionVehiclesDtos?.length">
        <i class="bi bi-truck-front"></i>
        <span class="count">{{ mission.missionVehiclesDtos?.length }}</span>
      </div>
      <div class="drivers" *ngIf="mission.missionVehiclesDtos?.length">
        <i class="bi bi-person"></i>
        <span class="count">{{ getNumbersOfDrivers() }}</span>
      </div>
      <div class="actions">
        <button class="action-btn" (click)="onEdit()">
          <i class="bi bi-three-dots"></i>
        </button>
      </div>
    </div>
  </div>
</div>
