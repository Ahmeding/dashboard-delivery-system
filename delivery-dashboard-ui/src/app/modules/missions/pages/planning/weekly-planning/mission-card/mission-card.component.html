<!-- src/app/components/mission-card/mission-card.component.html -->
<div class="mission-card"
     [style.backgroundColor]="getDestinationColor() + '10'"
     [style.borderLeft]="'3px solid ' + getDestinationColor()"
     (click)="!isUserAsDriver() && openEditMissionModal(mission)">

  <div class="mission-header">
    <div class="time-destination">
      <span class="time">{{ getStartTime() }}</span>
      <span class="mission-title" [style.color]="getDestinationColor()">
        {{ mission.title }}
      </span>
    </div>
    <div class="status">
      <i [class]="'bi ' + getStatusIcon()" [title]="mission.missionStatus"></i>
    </div>
  </div>

  <div class="mission-content">
    <div class="info-row">
      <div class="info-badge volume">
        <i class="bi bi-box-seam"></i>
        {{ mission.volume }}m³
      </div>
      <div class="info-badge id">
        <i class="bi bi-hash"></i>
        {{ mission.id }}
      </div>
    </div>

    <div class="resources-container" *ngIf="mission.missionVehicles?.length">
      <div class="resources-scroll">
        <ng-container *ngFor="let mv of mission.missionVehicles">
          <div class="resource-group">
            <div class="resource-badge vehicle">
              <i class="bi bi-truck"></i>
              <span class="plate">{{ "mv.vehicle?.immatriculation" }}</span>
            </div>
            <div class="drivers-list">
              <div class="resource-badge driver" *ngFor="let driver of mv.driverVehicles">
                <i class="bi bi-person-badge"></i>
                <span class="name">{{ "driver.driverId?.firstname "}}</span>
              </div>
            </div>
          </div>
        </ng-container>
      </div>
    </div>
  </div>

  <button *ngIf="isUserAsDriver()" class="action-btn"
          (click)="toggelMenu($event,mission.id!)">
    <i class="bi bi-three-dots-vertical"></i>
  </button>
  <div class="menu-container" [class.visible]="currentOpenMenuId === mission.id">
    <div *ngIf="isInputDateSameDay()" class="menu-option km-option" (click)="handleStarEndKm(mission)">
      <i class="bi bi-speedometer2 me-2"></i>
      Start/End Km
    </div>
    <div class="menu-option expenses-option" (click)="handleExpenses(mission)">
      <i class="bi bi-cash-coin me-2"></i>
      Expenses</div>
  </div>
</div>
