<!-- src/app/components/mission-card/mission-card.component.html -->
<div class="mission-card"
     [style.backgroundColor]="getDestinationColor() + '10'"
     [style.borderLeft]="'3px solid ' + getDestinationColor()"
     (click)="openEditMissionModal(mission)">

  <div class="mission-header">
    <div class="time-destination">
      <span class="time">{{ getStartTime() }}</span>
      <span class="mission-title" [style.color]="getDestinationColor()">
        {{ mission.titre }}
      </span>
    </div>
    <div class="status">
      <i [class]="'bi ' + getStatusIcon()" [title]="mission.etatMission"></i>
    </div>
  </div>

  <div class="mission-content">
    <div class="info-row">
      <div class="info-badge volume">
        <i class="bi bi-box-seam"></i>
        {{ mission.volume }}m³
      </div>
      <div class="info-badge id">
        <i class="bi bi-hash"></i>
        {{ mission.id }}
      </div>
    </div>

    <div class="resources-container" *ngIf="mission.missionVehiclesDtos?.length">
      <div class="resources-scroll">
        <ng-container *ngFor="let mv of mission.missionVehiclesDtos">
          <div class="resource-group">
            <div class="resource-badge vehicle">
              <i class="bi bi-truck"></i>
              <span class="plate">{{ mv.vehicleDto?.immatriculation }}</span>
            </div>
            <div class="drivers-list">
              <div class="resource-badge driver" *ngFor="let driver of mv.chauffeursVehicleDto">
                <i class="bi bi-person-badge"></i>
                <span class="name">{{ driver.chauffeurDto?.firstname }}</span>
              </div>
            </div>
          </div>
        </ng-container>
      </div>
    </div>
  </div>

<!--  <button class="action-btn" (click)="$event.stopPropagation(); onEdit()">
    <i class="bi bi-three-dots-vertical"></i>
  </button>-->
</div>
