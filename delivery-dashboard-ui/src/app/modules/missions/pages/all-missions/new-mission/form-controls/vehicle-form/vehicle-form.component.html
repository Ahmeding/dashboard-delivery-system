<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h5 class="section-title mb-0">
        <i class="bi bi-truck me-2"></i>Vehicles & Drivers
      </h5>
    </div>

    <div formArrayName="missionVehiclesDtos">
      <div *ngFor="let vehicle of missionVehiclesDtos.controls; let i=index" [formGroupName]="i" class="vehicle-item">
        <div class="row">
          <div class="col-md-5">
            <div class="form-floating">
              <select
                formControlName="vehicleDto"
                class="form-select"
                [class.is-invalid]="vehicle.get('vehicleDto')?.invalid && vehicle.get('vehicleDto')?.touched"
              >
                <option value="">Select Vehicle</option>
                <option *ngFor="let v of availableVehicles" [ngValue]="v">
                  {{v.immatriculation}} - {{v.marque}} ({{v.volume}}m³)
                </option>
              </select>
              <label>Vehicle<span class="required">*</span></label>
            </div>
          </div>

          <div class="col-md-5">
            <div class="form-floating">
              <select
                formControlName="chauffeursVehicleDto"
                class="form-select"
                [class.is-invalid]="vehicle.get('chauffeursVehicleDto')?.invalid && vehicle.get('chauffeursVehicleDto')?.touched"
                multiple
                [size]="2"
              >
                <option *ngFor="let driver of availableDrivers" [ngValue]="driver">
                  {{driver.firstname}} {{driver.lastname}}
                </option>
              </select>
              <label>Drivers (max 2)<span class="required">*</span></label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
