<div class="card">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h5 class="section-title mb-0">
        <i class="bi bi-geo-alt me-2"></i>Mission Stages
      </h5>
    </div>

    <div formArrayName="etapeDtos">
      <div *ngFor="let etape of etapeDtos.controls; let i=index" [formGroupName]="i" class="stage-item">
        <div class="stage-content">
          <div class="row">
            <div class="col-md-4">
              <div class="form-floating">
                <input
                  formControlName="lieuDepart"
                  class="form-control"
                  [class.is-invalid]="etape.get('lieuDepart')?.invalid && etape.get('lieuDepart')?.touched"
                  type="text"
                  placeholder="Departure"
                />
                <label>Departure<span class="required">*</span></label>
              </div>
            </div>

            <div class="col-md-4">
              <div class="form-floating">
                <select
                  formControlName="lieuArrivee"
                  class="form-select"
                  [class.is-invalid]="etape.get('lieuArrivee')?.invalid && etape.get('lieuArrivee')?.touched"

                >
                  <option value="">Select Destination</option>
                  <option *ngFor="let point of deliveryPointsByCity" [value]="point.id">
                    {{point.name}} - {{point.addressDto?.ville}}
                  </option>
                </select>
                <label>Destination<span class="required">*</span></label>
              </div>
            </div>

            <div class="col-md-3">
              <div class="form-floating">
                <input
                  formControlName="scheduledDeliveryTime"
                  class="form-control"
                  [class.is-invalid]="etape.get('scheduledDeliveryTime')?.invalid && etape.get('scheduledDeliveryTime')?.touched"
                  type="time"
                  placeholder="Delivery Time"
                />
                <label>Delivery Time<span class="required">*</span></label>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
