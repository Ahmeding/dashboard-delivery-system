<div class="container mt-5">
  <div class="card shadow-hover p-4">
    <h3 class="text-center mb-4">Create New Expense</h3>
    <form #expenseForm="ngForm" (ngSubmit)="onSubmit(expenseForm)">

      <!-- Name Field -->
      <div class="form-group">
        <input
          type="text"
          id="nom"
          class="form-control"
          name="nom"
          [(ngModel)]="expense.name"
          placeholder=" "
          required />
        <label for="nom">Name</label>
      </div>

      <!-- Commentaire Field -->
      <div class="form-group">
        <textarea
          id="commentaire"
          class="form-control"
          name="commentaire"
          [(ngModel)]="expense.comment"
          placeholder=" "
          rows="3"
          required></textarea>
        <label for="commentaire">Comment</label>
      </div>

      <!-- Created At Field -->
      <div class="form-group">
        <input
          type="date"
          id="createdAt"
          class="form-control"
          name="createdAt"
          [(ngModel)]="expense.expenseDate"
          placeholder=" "
          required />
        <label for="createdAt">Created At</label>
      </div>




      <!-- Mission Details (Optional) -->
      <div class="form-group">
        <select
          type="text"
          id="mission"
          class="form-control"
          name="missionBasicDto"
          [(ngModel)]="expense.missionId"
          placeholder=" " >
          <option>fdgdfhfdh</option>
        </select>
        <label for="mission">Mission Title</label>
      </div>
      <button
        type="submit"
        class="btn btn-primary btn-block"
        [disabled]="expenseForm.invalid">
        <i class="bi bi-save"></i> Save Expense
      </button>
    </form>
  </div>
</div>
