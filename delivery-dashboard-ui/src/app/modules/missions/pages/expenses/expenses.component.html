
<div id="content">
  <!-- Begin Page Content -->
  <div class="container-fluid">

    <!-- Page Heading -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
      <h1 class="h3 mb-0 text-gray-800">Expenses</h1>
    </div>

    <!-- Content Row Table -->

    <div class="d-sm-flex align-items-center justify-content-between mb-4">
      <h1 class="h3 mb-0 text-gray-800">See all Expenses</h1>
      <a class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm"
         data-toggle="modal" data-target="#vehicleModal" (click)="navigateToNewExpenses()"><i
        class="bi bi-plus fa-sm text-white-50"></i>New Expence</a>
    </div>

    <!-- DataTales Example -->
    <div class="card shadow mb-4">
      <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">Expenses</h6>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover" width="100%" cellspacing="0">
            <thead>
            <tr>
              <th># ID</th>
              <th>Desination</th>
              <th>Mission</th>
              <th>Expenses List</th>
              <th>Total</th>
              <th>Created by</th>
              <th>Date</th>
              <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let expense of allExpensesResponse.content">
              <td>{{ expense.id}}</td>
              <td>{{ expense.name }}</td>
              <td>{{ expense.missionId }}</td>
              <td>total</td>
              <td>{{ "expense.createdByUser?.fullname" }}</td>
              <td>date</td>
              <td>
                <i class="bi bi-pen text-warning mr-2" data-toggle="modal"
                   data-target="#editVehicleModal"  (click)="editVehicle(expense.id!)" title="Modify"></i>
                <i class="bi bi-eye text-info ml-3" title="Détail"
                   data-toggle="modal" data-target="#infoVehicleModal" (click)="selectedExpenses = expense"></i>
                <i class="bi bi-trash text-danger ml-3 mr-3" title="Supprimer" (click)="deleteVehicle(expense.id!)"></i>

              </td>
            </tr>
            </tbody>
          </table>

          <div class="d-flex justify-content-center mt-3">
            <nav aria-label="Page navigation">
              <ul class="pagination">
                <li class="page-item">
                  <a class="page-link"
                     [class.disabled]="page == 0"
                     (click)="goToFirstPage()"
                     aria-label="First Page"
                     href="javascript:void(0)"
                  >
                    <i class="bi bi-chevron-double-left"></i>
                  </a>
                </li>
                <li class="page-item">
                  <a class="page-link"
                     [class.disabled]="page == 0"
                     (click)="goToPreviousPage()"
                     aria-label="Pevious Page"
                     href="javascript:void(0)">
                    <i class="bi bi-chevron-left"></i>
                  </a>
                </li>

                <li class="page-item" *ngFor="let _ of [].constructor(this.allExpensesResponse.totalPages);let pageIndex = index">
                  <a class="page-link"
                     (click)="goToPage(pageIndex)"
                     aria-label="Page"
                     href="javascript:void(0)"
                     [class.active]="page == pageIndex"
                  >
                    {{pageIndex +1}}
                  </a>
                </li>

                <li class="page-item">
                  <a class="page-link"
                     [class.disabled]="isLastPage"
                     (click)="goToNextPage()"
                     aria-label="Next Page"
                     href="javascript:void(0)">

                    <i class="bi bi-chevron-right"></i>
                  </a>
                </li>
                <li class="page-item">
                  <a class="page-link"
                     [class.disabled]="isLastPage"
                     (click)="goToLastPage()"
                     aria-label="Last Page"
                     href="javascript:void(0)">
                    <i class="bi bi-chevron-double-right"></i>
                  </a>
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </div>
    </div>

  </div>
  <!-- /.container-fluid -->

</div>
