<div id="content">
  <!-- Begin Page Content -->
  <div class="container-fluid">
    <!-- Page Heading -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
      <h1 class="h3 mb-0 text-gray-800">Clients</h1>
    </div>
    <div class="container mt-5">
      <div class="card shadow-hover p-4">
        <h3 class="text-center mb-4">{{ isEditMode?"Update":"Create New" }} Client</h3>
        <div class="vehicle-form">
       <form [formGroup]="clientForm" (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <input (click)="inputFillDataOnClick()" type="text" class="form-control" id="firstname"
                     formControlName="firstname" placeholder=""
                     [class.is-invalid]="isFieldInvalid('firstname')">
              <label for="firstname">First Name</label>
              <div class="invalid-feedback" *ngIf="isFieldInvalid('firstname')">
                First name is required
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <input type="text" class="form-control" id="lastname"
                     formControlName="lastname" placeholder=""
                     [class.is-invalid]="isFieldInvalid('lastname')">
              <label for="lastname">Last Name</label>
              <div class="invalid-feedback" *ngIf="isFieldInvalid('lastname')">
                Last name is required
              </div>
            </div>
          </div>
        </div>
      <!-- Contact Information -->
        <div class="row g-3">
          <div class="col-md-6">
            <div class="form-group">
              <input type="email" class="form-control" id="email"
                     formControlName="email" placeholder=""
                     [class.is-invalid]="isFieldInvalid('email')">
              <label for="email">Email</label>
              <div class="invalid-feedback" *ngIf="isFieldInvalid('email')">
                Please enter a valid email address
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <input type="tel" class="form-control" id="phoneNum"
                     formControlName="phoneNum" placeholder=""
                     [class.is-invalid]="isFieldInvalid('phoneNum')">
              <label for="phoneNum">Phone Number</label>
              <div class="invalid-feedback" *ngIf="isFieldInvalid('phoneNum')">
                Please enter a valid phone number
              </div>
            </div>
          </div>
        </div>
      <!-- Business Information -->
        <div class="row g-3">
          <div class="col-md-6">
            <div class="form-group">
              <input type="text" class="form-control" id="siren"
                     formControlName="siren" placeholder="">
              <label for="siren">SIREN</label>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <input type="text" class="form-control" id="siret"
                     formControlName="siret" placeholder="">
              <label for="siret">SIRET</label>
            </div>
          </div>
        </div>


      <!-- Address -->
      <div formGroupName="address">
        <div class="row g-3">
          <div class="col-md-6">
            <div class="form-group">
              <input type="text" class="form-control" id="street"
                     formControlName="adresse1" placeholder=""
                     [class.is-invalid]="isFieldInvalid('address.adresse1')">
              <label for="street">Street Address</label>
              <div class="invalid-feedback" *ngIf="isFieldInvalid('address.adresse1')">
                Please enter a valid street
              </div>
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-group">
              <input type="text" class="form-control" id="street2"
                     formControlName="adresse2" placeholder="">
              <label for="street2">Street Address (optional)</label>
            </div>
          </div>
        </div>
        <div class="row g-3">
          <div class="col-md-6">
            <div class="form-group">
              <input type="text" class="form-control" id="city"
                     formControlName="ville" placeholder=""
                     [class.is-invalid]="isFieldInvalid('address.ville')">
              <label for="city">City</label>
              <div class="invalid-feedback" *ngIf="isFieldInvalid('address.ville')">
                Please enter a valid street
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="form-group">
              <input type="text" class="form-control" id="postalCode"
                     formControlName="codepostal" placeholder=""
                     [class.is-invalid]="isFieldInvalid('address.codepostal')">
              <label for="postalCode">Postal Code</label>
              <div class="invalid-feedback" *ngIf="isFieldInvalid('address.codepostal')">
                Please enter a valid postal code
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="form-group">
              <input type="text" class="form-control" id="country"
                     formControlName="pays" placeholder=""
                     [class.is-invalid]="isFieldInvalid('address.pays')">
              <label for="country">Country</label>
              <div class="invalid-feedback" *ngIf="isFieldInvalid('address.pays')">
                Please enter a valid country
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Additional Information -->
      <div class="form-section">
        <div class="row g-3">
          <div class="col-12">
            <div class="form-group">
              <textarea class="form-control" id="description"
                        formControlName="description" placeholder=""
                        style="height: 100px"></textarea>
              <label for="description">Description</label>
            </div>
          </div>
        </div>
      </div>

    <div class="d-flex justify-content-end">
      <button type="button" class="btn btn-outline-secondary" routerLink="/clients/all">
        Cancel
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="clientForm.invalid || isSubmitting">
        <i class="bi bi-save"></i>
        {{ isEditMode ? 'Update' : 'Create' }} Client
      </button>
    </div>
  </form>
        </div>
      </div>
    </div>
  </div>
</div>
