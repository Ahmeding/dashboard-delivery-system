<div class="client-form-container">
  <div class="form-header">
    <h1>{{ isEditMode ? 'Edit Order' : 'New Order' }}</h1>
    <button class="btn btn-outline-secondary" routerLink="/orders/all">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <div class="">
    <div class="card mb-4">
      <div class="card-body">
        <form #form="ngForm">
          <!-- ligne 1-->
          <div class="row mb-3">
            <div class="col-md-4">
              <div class="form-floating mb-3 mb-md-0">
                <input  [(ngModel)]="newQuote.code"
                        [ngClass]="{'is-invalid': isFormAddNewSubmitted && form.controls['code']?.invalid}"
                        name="code"  class="form-control" id="inputCode" type="text" placeholder="Code"  required/>
                <label for="inputCode">Code</label>
                <small *ngIf="isFormAddNewSubmitted && form.controls['code']?.invalid" class="text-danger">Code is required</small>
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-floating mb-3 mb-md-0">
                <select id="inputClient" [(ngModel)]="newQuote.clientId"
                        [ngClass]="{'is-invalid':isFormAddNewSubmitted && form.controls['selectClient'].invalid}"
                        class="form-select" name="selectClient" required>
                  <option [ngValue]="undefined" class="text-primary"
                          selected disabled>Select client</option>
                  <option *ngFor="let client of allClients" [ngValue]="client.id">{{client.firstname}} &nbsp; {{client.lastname}}</option>
                </select>
                <label for="inputClient">Select Client</label>
                <small *ngIf="isFormAddNewSubmitted && form.controls['selectClient']?.invalid" class="text-danger">Client is required</small>
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-floating mb-3 mb-md-0">
                <input  [(ngModel)]="newQuote.dateCommnde"
                        [ngClass]="{'is-invalid': isFormAddNewSubmitted && form.controls['orderdate']?.invalid}"
                        name="orderdate" class="form-control" id="inputQuoteDate" type="datetime-local" placeholder="Date"  required/>
                <label for="inputQuoteDate">Date</label>
                <small *ngIf="isFormAddNewSubmitted && form.controls['orderdate']?.invalid" class="text-danger">Date is required</small>
              </div>
            </div>
          </div>

          <!-- ligne 2-->
          <div class="row mb-3">
            <div class="col-md-11">
              <div class="form-floating mb-3 mb-md-0">
                <select id="inputServiceDelivery"
                        [(ngModel)]="selectedServiceDelivery"
                        (ngModelChange)="onServiceDeliveryChange()"
                        [ngClass]="{'is-invalid': isFormAddNewSubmitted && (form.controls['serviceDelivery'].invalid)}"
                        class="form-select" name="serviceDelivery">
                  <option [ngValue]="undefined" class="text-primary" selected disabled>Select Service</option>
                  <option *ngFor="let serviceDelivery of allServiceDeliveries" [ngValue]="serviceDelivery">{{serviceDelivery.title}} &nbsp; ({{serviceDelivery.description}})</option>
                </select>
                <label for="inputServiceDelivery">Select Serive</label>
                <small *ngIf="isFormAddNewSubmitted && (form.controls['serviceDelivery']?.invalid)" class="text-danger">Service is required</small>
              </div>
            </div>
            <div class="col-md-1">
              <div class="form-floating mb-3 mb-md-0">
                <button class="btn btn-outline-success" (click)="addServDelivery()"><i class="bi bi-plus"></i></button>
              </div>
            </div>
          </div>


          <!-- ligne 3-->
          <div class="row mb-3">

            <table class="table table-hover">

              <th>REF°</th>
              <th>Label</th>
              <th>Quantity</th>
              <th>Price</th>
              <th>Tva</th>
              <th>Action</th>

              <tr *ngFor="let orderL of orderlines; let i = index">
                <td>{{ orderL.serviceDeliveryDtoId }}</td>
                <td>servile delivery</td>
                <td><select (change)="onQteChange($event,i)"
                            id="selectQte" class="form-select qte-select" name="qte">
                  <option [ngValue]="1">1</option>
                  <option [ngValue]="2">2</option>
                  <option [ngValue]="3">3</option>
                  <option [ngValue]="4">4</option>
                  <option [ngValue]="5">5</option>
                  <option [ngValue]="6">6</option>
                </select></td>
                <td>price service delivery €</td>
                <td>20%</td>
                <td><i class="bi bi-trash text-danger" (click)="deleteServDelivery(i)"></i></td>
              </tr>

            </table>

          </div>

        </form>

      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
    <button type="button" class="btn btn-primary" (click)="addNewQuote(form)">Save</button>
  </div>
</div>
