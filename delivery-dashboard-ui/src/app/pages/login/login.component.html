<div class="login-container">
  <div class="login-box">
    <h2>Welcome !</h2>
    <p>Please login to continue</p>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">

        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          [ngClass]="{ 'is-invalid': loginForm.get('email')?.invalid && loginForm.get('email')?.touched }"
          placeholder=""
        /><label for="email">Email</label>
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="invalid-feedback">
          Please enter a valid email.
        </div>
      </div>
      <div class="form-group">

        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          [ngClass]="{ 'is-invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched }"
          placeholder=""
        /><label for="password">Password</label>
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="invalid-feedback">
          Password is required.
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm"></span>
        <span [ngClass]="isLoading?'hidden' : ''">&nbsp;Login</span>
      </button>
      <div class="invalid-credentials">
        {{ errorSubject }} : <span *ngFor="let err of errorsMsg">{{err}}</span>
      </div>
    </form>
    <div class="footer-links">
    </div>
  </div>
</div>
