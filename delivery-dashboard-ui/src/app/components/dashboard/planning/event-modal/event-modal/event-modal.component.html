<div class="modal-header">
  <h4 class="modal-title">{{isEditMode ? 'Edit Event' : 'Add New Event'}}</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body">
  <form [formGroup]="eventForm" (ngSubmit)="onSubmit()">
    <div class="form-group mb-3">
      <input type="text" class="form-control" id="title" formControlName="title" placeholder=" " />
      <label for="title" class="form-label">Title</label>
    </div>

    <div class="row mb-3">
      <div class="form-group col">
        <input type="datetime-local" class="form-control" id="start" formControlName="start">
        <label for="start" class="form-label">Start Date</label>
      </div>
      <div class="form-group col">
        <input type="datetime-local" class="form-control" id="end" formControlName="end">
        <label for="end" class="form-label">End Date</label>
      </div>
    </div>

    <div class="form-group mb-3">
      <input type="text" class="form-control" id="location" formControlName="location" placeholder="Event location">
      <label for="location" class="form-label">Location</label>
    </div>

    <div class="form-group mb-3">
      <textarea class="form-control" id="description" formControlName="description" rows="3"></textarea>
      <label for="description" class="form-label">Description</label>
    </div>

    <div class="form-group mb-3">
      <input type="color" class="form-control form-control-color" id="backgroundColor" formControlName="backgroundColor">
      <label for="backgroundColor" class="form-label">Color</label>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-danger me-2" *ngIf="isEditMode" (click)="onDelete()">
    Delete
  </button>
  <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss()">
    Cancel
  </button>
  <button type="button" class="btn btn-primary" (click)="onSubmit()" [disabled]="!eventForm.valid">
    {{isEditMode ? 'Update' : 'Add'}}
  </button>
</div>
