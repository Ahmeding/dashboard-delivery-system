<div class="notifications-dropdown" ngbDropdown>
  <button class="btn btn-link position-relative" ngbDropdownToggle>
    <i class="bi bi-bell"></i>
    <span class="badge bg-danger" *ngIf="unreadCount > 0">{{unreadCount}}</span>
  </button>

  <div class="dropdown-menu dropdown-menu-end" ngbDropdownMenu>
    <div class="dropdown-header d-flex justify-content-between align-items-center">
      <span>Notifications</span>
      <button class="btn btn-link btn-sm" (click)="markAllAsRead()">
        Mark all as read
      </button>
    </div>

    <div class="notifications-list">
      <ng-container *ngIf="notifications.length > 0; else noNotifications">
        <a *ngFor="let notification of notifications"
           class="dropdown-item notification-item"
           [class.unread]="!notification.isRead"
           (click)="markAsRead(notification)">
          <div class="notification-icon" [ngClass]="notification.type">
            <i class="bi" [ngClass]="{
              'bi-info-circle': notification.type === 'info',
              'bi-exclamation-triangle': notification.type === 'warning',
              'bi-check-circle': notification.type === 'success',
              'bi-x-circle': notification.type === 'danger'
            }"></i>
          </div>
          <div class="notification-content">
            <p class="message">{{notification.message}}</p>
            <span class="time">{{notification.time}}</span>
          </div>
        </a>
      </ng-container>

      <ng-template #noNotifications>
        <div class="no-notifications">
          <i class="bi bi-bell-slash"></i>
          <p>No notifications</p>
        </div>
      </ng-template>
    </div>

    <div class="dropdown-footer">
      <button class="btn btn-link btn-sm" (click)="clearAll()">
        Clear all
      </button>
    </div>
  </div>
</div>
