<div class="profile-menu" ngbDropdown>
  <button class="btn btn-link d-flex align-items-center" ngbDropdownToggle>
    <span class="user-name d-none d-md-inline">{{fullname}}</span>
    <img [src]="user.avatar" alt="Profile" class="avatar  ms-2 ">
  </button>

  <div class="dropdown-menu dropdown-menu-end" ngbDropdownMenu>
    <div class="dropdown-header">
      <div class="user-info">
        <h6 class="mb-0">{{fullname}}</h6>
        <small class="text-muted">{{user.email}}</small>
      </div>
    </div>

    <div class="dropdown-divider"></div>

    <a class="dropdown-item" (click)="navigateToProfile()">
      <i class="bi bi-person me-2"></i>
      My Profile
    </a>
    <a class="dropdown-item" routerLink="/settings">
      <i class="bi bi-gear me-2"></i>
      Settings
    </a>

    <div class="dropdown-divider"></div>

    <a class="dropdown-item text-danger" (click)="logout()">
      <i class="bi bi-box-arrow-right me-2"></i>
      Logout
    </a>
  </div>
</div>
