<div class="sidebar" [ngClass]="{'collapsed': isCollapsed, 'show-mobile': isMobileMenuOpen}">
  <div class="sidebar-header">
    <img src="assets/logo.png" alt="Logo" class="logo">
    <span class="brand-name" *ngIf="!isCollapsed || isMobileMenuOpen">Delivery System</span>
  </div>

  <ul class="nav flex-column">
    <li class="nav-item" *ngFor="let item of menuItems">
      <ng-container *ngIf="!item.children">
        <a [routerLink]="item.route"
           routerLinkActive="active"
           class="nav-link"
           (click)="closeMobileMenu()">
          <i [class]="'bi ' + item.icon"></i>
          <span *ngIf="!isCollapsed || isMobileMenuOpen">{{item.label}}</span>
        </a>
      </ng-container>

      <ng-container *ngIf="item.children">
        <a class="nav-link" (click)="item.expanded = !item.expanded">
          <i [class]="'bi ' + item.icon"></i>
          <span *ngIf="!isCollapsed || isMobileMenuOpen">{{item.label}}</span>
          <i *ngIf="!isCollapsed || isMobileMenuOpen"
             class="bi bi-chevron-down submenu-icon"
             [ngClass]="{'rotated': item.expanded}"></i>
        </a>
        <ul class="submenu" [ngClass]="{'show': item.expanded && (!isCollapsed || isMobileMenuOpen)}">
          <li *ngFor="let child of item.children">
            <a [routerLink]="child.route"
               routerLinkActive="active"
               class="nav-link"
               (click)="closeMobileMenu()">
              <i [class]="'bi ' + child.icon"></i>
              <span *ngIf="!isCollapsed || isMobileMenuOpen">{{child.label}}</span>
            </a>
          </li>
        </ul>
      </ng-container>
    </li>
  </ul>
</div>
