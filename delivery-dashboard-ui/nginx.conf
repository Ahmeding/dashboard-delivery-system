events {}

http {
  server {
    listen 80;

    # Serve static files (Angular app)
    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;

      # Block non-GET/HEAD requests for static files
      if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
      }
    }

    # Handle JS/CSS files with MIME types
    location ~ \.(js|css)$ {
      root /usr/share/nginx/html;
      include /etc/nginx/mime.types;
    }

    # Catch-all for client-side routes (e.g., refreshes)
    location ~ ^/.+$ {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;

      # Block non-GET/HEAD requests
      if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
      }
    }

    # Proxy backend API requests
    location /api {
      proxy_pass http://ds-api:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect 405 errors to Angular's index.html
    error_page 405 =200 /index.html;
  }
}
