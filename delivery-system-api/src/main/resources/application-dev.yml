spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ds_db?createDatabaseIfNotExist=true #jdbc:mysql://localhost:3306/delivery_db?createDatabaseIfNotExist=true&userSSL=false&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
    username: postgres #root
    password: admin #
    driver-class-name: org.postgresql.Driver #com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl:-auto: update
    show-sql: false
    properties:

      dialect: org.hibernate.dialect.PostgreSQLDialect #org.hibernate.dialect.MySQL8Dialect
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        session_factory:
          statement_inspector: com.hitecart.deliverysystem.interceptor.Interceptor
    database   : postgresql #MYSQL

  jackson:
    serialization.write-date-keys-as-timestamps: false
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

