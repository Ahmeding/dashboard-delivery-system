name: DS Frontend Pipeline

on:
  push:
    branches:
      - feature/stock #create-backend-pipeline
    paths:
      - delivery-dashboard-ui/**
      - docker/frontend/**
      - 'docker-compose.yml'
      - .github/workflows/*-frontend.yml

jobs:
  build-image:
    name: Build Frontend Image
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extarct Prohject FE Version
        id: extract_version
        run: |
          cd delivery-dashboard-ui
          sudo apt-get install -y jq
          echo "VERSION=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT
      - name: Login To Dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Debug VERSION
        run: echo "VERSION is ${{ steps.extract_version.outputs.VERSION }}"
      - name: Build & Push to DockerHub
        uses: docker/build-push-action@v7
        with:
          context: delivery-dashboard-ui
          file: docker/frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ds-ui:${{ steps.extract_version.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ds-ui:latest


  deploy:
    name: Deploy Frontend
    runs-on: self-hosted
    needs: [ build-image ]
    steps:
     # - name: set up ssh agent
     #   uses: webfactory/ssh-agent@v0.7.0
     #   with:
     #     ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 1. Récupérer le docker-compose.yml
      - name: Checkout code
        uses: actions/checkout@v5

    #  - name: Create Deployment Folder
    #    run: ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} "mkdir -p ci-cd"
    #  - name: Copy Docker-compose file
    #    run: scp docker-compose.yml ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }}:ci-cd/docker-compose.yml
      # 2. Créer le dossier et copier le fichier EN LOCAL (sans SSH)
      - name: Create Deployment Folder and Copy
        run: |
          mkdir -p ci-cd
          cp docker-compose.yml ci-cd/docker-compose.yml
      # 3. Déployer avec Docker Compose EN LOCAL
      - name: Set ENV variable and deploy
        run: |
          cd ci-cd
          docker compose -f docker-compose.yml pull -q
          docker compose -f docker-compose.yml up -d

