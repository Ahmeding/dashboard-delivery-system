name: DS Frontend Pipeline

on:
  push:
    branches:
      - create-backend-pipeline
    paths:
      - delivery-dashboard-ui/**
      - docker/frontend/**
      - 'docker-compose.yml'
      - .github/workflows/*-frontend.yml

jobs:
  build-image:
    name: Build Frontend Image
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extarct Prohject FE Version
        id: extract_version
        run: |
          cd delivery-dashboard-ui
          # apt install jq
          echo "VERSION = $(jq -r '.verion' package.json)" >> $GITHUB_OUTPUT
      - name: Login To Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

